    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        // Reload page when new service worker takes control (prevent whitescreen on update)
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[PWA] Controller changed (new service worker active). Reloading page...');
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[PWA] Service Worker registered successfully:', registration.scope);
              
              // Check for updates every hour
              setInterval(() => {
                registration.update();
              }, 60 * 60 * 1000);

              // Check for updates immediately
              registration.update();
            })
            .catch((error) => {
              console.error('[PWA] Service Worker registration failed:', error);
              console.log('[PWA] Make sure you are accessing via HTTPS or localhost');
            });
        });
      } else {
        console.warn('[PWA] Service Worker not supported in this browser');
      }
    </script>
