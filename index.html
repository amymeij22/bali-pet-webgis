    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        // Guard: only reload on controllerchange if there was already a controller
        // (i.e., this is a real update, not the very first SW activation)
        var hadController = !!navigator.serviceWorker.controller;
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          // Only reload if: (1) there was a previous controller, (2) not already refreshing
          if (hadController && !refreshing) {
            refreshing = true;
            console.log('[PWA] SW controller changed (update). Reloading...');
            window.location.reload();
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('[PWA] Service Worker registered:', registration.scope);

              // Delay update check by 30s after page is stable
              // Avoids reload-loop on first install in PWA standalone mode
              setTimeout(function() {
                registration.update().catch(function() {});
              }, 30000);

              // Hourly update checks
              setInterval(function() {
                registration.update().catch(function() {});
              }, 60 * 60 * 1000);
            })
            .catch(function(error) {
              console.error('[PWA] Service Worker registration failed:', error);
            });
        });
      } else {
        console.warn('[PWA] Service Worker not supported in this browser');
      }
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Inline loading screen - visible ONLY until React mounts (double-rAF fade) -->
      <!-- Uses the actual app icon so no jarring change on load -->
      <style>
        #pwa-splash {
          position: fixed; inset: 0;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          background: #1a3a5c;
          z-index: 9999;
          font-family: system-ui, -apple-system, sans-serif;
        }
        #pwa-splash .splash-icon-wrap {
          width: 96px; height: 96px;
          border-radius: 22px;
          background: #ffffff;
          display: flex; align-items: center; justify-content: center;
          margin-bottom: 22px;
          box-shadow: 0 12px 36px rgba(0,0,0,0.35);
          overflow: hidden;
        }
        #pwa-splash .splash-icon-wrap img {
          width: 100%; height: 100%;
          object-fit: cover;
          display: block;
        }
        #pwa-splash h1 {
          font-size: 20px; font-weight: 700;
          color: #ffffff; margin: 0 0 6px 0;
          letter-spacing: -0.3px;
        }
        #pwa-splash p {
          font-size: 13px; color: rgba(255,255,255,0.65); margin: 0 0 32px 0;
        }
        #pwa-splash .splash-dots {
          display: flex; gap: 8px;
        }
        #pwa-splash .splash-dot {
          width: 8px; height: 8px; border-radius: 50%;
          background: #2ecc71;
          animation: splashPulse 1.2s ease-in-out infinite;
        }
        #pwa-splash .splash-dot:nth-child(2) { animation-delay: 0.2s; }
        #pwa-splash .splash-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes splashPulse {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
          40% { opacity: 1; transform: scale(1); }
        }
      </style>
      <div id="pwa-splash" aria-label="Memuat aplikasi...">
        <div class="splash-icon-wrap">
          <!-- Real app icon – cached by SW so no extra network request -->
          <img src="/icons/icon-192x192.png" alt="Bali PET" width="96" height="96" />
        </div>
        <h1>Bali PET</h1>
        <p>Kenyamanan Termal Destinasi Wisata</p>
        <div class="splash-dots">
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
